name: CI

on:
  push:
    branches: [main, v2]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, typecheck, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

  e2e:
    name: End-to-end tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium --with-deps

      - name: Install system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Run Playwright
        # No GNEWS_API_KEY on purpose: the suite runs against local fixtures, so
        # it is deterministic and never spends the upstream daily quota.
        run: npx playwright test --project=chromium

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  deploy:
    name: Deploy to production
    # The gate: production only ever ships code that passed both suites, and
    # only from main. A red build on any branch simply never reaches this job.
    needs: [quality, e2e]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Pull Vercel environment
        run: npx vercel pull --yes --environment=production --token=$VERCEL_TOKEN
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Build
        run: npx vercel build --prod --token=$VERCEL_TOKEN
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Deploy
        id: deploy
        # --prebuilt uploads the artifact built above, so what ships is exactly
        # what the tests ran against rather than a fresh build on Vercel.
        run: echo "url=$(npx vercel deploy --prebuilt --prod --token=$VERCEL_TOKEN)" >> "$GITHUB_OUTPUT"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Smoke-test the deployment
        # Deliberately not steps.deploy.outputs.url: that is the immutable
        # per-deployment hostname, which Vercel's Deployment Protection puts
        # behind auth and answers with a 302. The public alias is what readers
        # actually hit, so that is what is worth checking.
        env:
          PRODUCTION_URL: ${{ vars.PRODUCTION_URL || 'https://news-aggregator-one-phi.vercel.app' }}
        run: |
          set -euo pipefail
          echo "Deployed: ${{ steps.deploy.outputs.url }}"
          echo "Checking:  $PRODUCTION_URL"

          status=$(curl -sS -o /tmp/smoke.json -w '%{http_code}' \
            "$PRODUCTION_URL/api/news?q=technology")
          echo "GET /api/news -> $status"
          [ "$status" = "200" ]

          # A 200 carrying an error envelope still means the deployment is not
          # serving news, so check the payload rather than just the status.
          node -e '
            const body = require("fs").readFileSync("/tmp/smoke.json", "utf8");
            const data = JSON.parse(body);
            if (data.error) {
              console.error("Upstream error:", data.error.code, "-", data.error.message);
              process.exit(1);
            }
            if (!Array.isArray(data.articles)) {
              console.error("Malformed payload: no articles array");
              process.exit(1);
            }
            console.log(`OK: ${data.articles.length} articles, demo=${data.demo}`);
          '
