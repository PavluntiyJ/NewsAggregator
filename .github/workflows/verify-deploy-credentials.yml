name: Verify deploy credentials

# Vercel tokens expire, and the failure mode is a red deploy on an otherwise
# good merge. This checks the credentials without shipping anything, so the
# token can be validated on demand rather than discovered broken mid-release.
on:
  workflow_dispatch:
  # Also runs whenever this file changes, which makes adding or editing it
  # self-testing.
  push:
    paths:
      - ".github/workflows/verify-deploy-credentials.yml"

jobs:
  verify:
    name: Check Vercel access
    runs-on: ubuntu-latest
    steps:
      - name: Confirm the token is present and non-empty
        run: |
          set -euo pipefail
          if [ -z "${VERCEL_TOKEN:-}" ]; then
            echo "::error::VERCEL_TOKEN is unset or empty."
            echo "Set it at Settings → Secrets and variables → Actions."
            exit 1
          fi
          echo "VERCEL_TOKEN is present (${#VERCEL_TOKEN} characters)."
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Confirm the token authenticates
        run: |
          set -euo pipefail
          who=$(npx --yes vercel@latest whoami --token="$VERCEL_TOKEN" 2>&1 | tail -1)
          echo "Authenticated as: $who"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Confirm the token can reach this project
        run: |
          set -euo pipefail
          npx --yes vercel@latest pull --yes --environment=production \
            --token="$VERCEL_TOKEN" >/dev/null
          echo "Pulled production settings for project $VERCEL_PROJECT_ID."
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
